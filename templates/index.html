<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policies - {{COMPANY_NAME}}</title>
<style>
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
         color:#202124; background:#fff; line-height:1.7; margin:0; }
  .wrap { max-width:820px; margin:0 auto; padding:48px 24px; }
  h1 { font-size:1.9rem; margin:0 0 8px; }
  .sub { color:#5f6368; margin-bottom:28px; }
  .card { display:block; border:1px solid #e8eaed; border-radius:10px; padding:18px 20px;
          margin-bottom:14px; text-decoration:none; color:inherit; transition:box-shadow .15s,border-color .15s; }
  .card:hover { border-color:#1a73e8; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .card h2 { font-size:1.15rem; margin:0 0 4px; color:#1a73e8; }
  .card p { margin:0; color:#5f6368; font-size:.92rem; }
  .meta { margin-top:40px; padding-top:18px; border-top:1px solid #e8eaed; font-size:.85rem; color:#5f6368; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Privacy Policies</h1>
  <div class="sub">Published by {{COMPANY_NAME}} &middot; Last updated {{LAST_UPDATED}}</div>

  <h2 style="font-size:1.2rem;margin:24px 0 12px;">Applications</h2>
  {{APP_CARDS}}

  <div class="meta">
    <p>{{COMPANY_NAME}} &copy; {{YEAR}}. All rights reserved.</p>
    <p>Contact: <a href="mailto:{{CONTACT_EMAIL}}" style="color:#1a73e8;">{{CONTACT_EMAIL}}</a></p>
  </div>
</div>
</body>
</html>
